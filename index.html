<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love, Undefined.</title><link rel="icon" href="logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#302c35;font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:620px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e0e8;padding-bottom:16px;margin-bottom:28px}header img{width:46px;border-radius:12px}header strong{font-size:19px}small,.muted{color:#706b75}h1{font-size:28px;line-height:1.3}h2{font-size:21px}button,a.button{font:inherit;cursor:pointer;border:1px solid #d8cde5;background:white;color:#49395e;border-radius:12px;padding:12px 16px;width:100%;display:block;margin:10px 0;text-align:center;text-decoration:none}button:hover{background:#eee8f6}button:focus-visible,a:focus-visible{outline:3px solid #a88bc9;outline-offset:3px}.primary{background:#67518b!important;color:white;border-color:#67518b}.quiet{border:0;background:transparent;color:#706b75}.person{display:flex;gap:16px;align-items:center;background:white;border:1px solid #e5e0e8;padding:16px;border-radius:18px;margin:14px 0}.person button{margin:8px 0 0}.avatar{width:86px;height:86px;flex:none;border-radius:18px;overflow:hidden;position:relative;background:#eee8f6}.avatar i{position:absolute;width:60%;height:60%;border-radius:50%;left:8%;top:12%;background:var(--a)}.avatar i:nth-child(2){left:38%;top:28%;background:var(--b);border-radius:25%}.avatar i:nth-child(3){left:17%;top:48%;background:var(--c)}.tag{font-size:13px;color:#67518b}.bubble{padding:13px 16px;background:#f8e8dc;border-radius:16px;margin:12px 35px 12px 0;white-space:pre-wrap}.own{background:#e9e3f6;margin:12px 0 12px 35px}.portrait{width:100%;max-width:300px;border-radius:18px;display:block;margin:18px auto}.note{padding:16px;background:#f0ebf5;border-radius:12px}footer{text-align:center;margin-top:30px;font-size:12px;color:#706b75}a{color:#67518b}#app:focus{outline:none}</style></head><body><main><header><img src="logo.png" alt=""><div><strong>Love, Undefined.</strong><br><small>匿名交友体验 · 课程研究</small></div></header><section id="app" tabindex="-1" aria-live="polite"></section><footer>虚构体验 · 不收集个人信息</footer></main><script>
const people=[{name:'Echo',age:22,gender:'女性',colors:['#F6A66B','#EA79A4','#9679CE'],tags:'音乐 · 电影 · 旅行',quote:'我喜欢收集适合雨天听的歌。',bio:'周末常去咖啡馆，偶尔一个人看电影。喜欢分享生活，但不太擅长主动开口。',q:['如果明天突然放假，你会怎么过？','你平时更喜欢一个人，还是有人陪？'],a:[['睡到自然醒，什么也不安排。','出去走走，找点新鲜的事情。','还没想好，换个话题吧。'],['喜欢有人一起分享生活。','我更享受自己的时间。','看情况，不一定。']],r:[['我也经常这样。最近忙起来，休息都像任务。','听起来不错，我有时也会临时买张电影票。','好呀，我们聊点别的。'],['我也喜欢分享，不过偶尔会不知道怎么开口。','我懂，我一个人看电影的时候也很自在。','确实，有时候想热闹，有时候只想安静。']]},{name:'Moss',age:23,gender:'男性',colors:['#62C4B0','#75B7E5','#EBC369'],tags:'阅读 · 自然 · 思考',quote:'我喜欢思考没有简单答案的问题。',bio:'平时喜欢读书，也会去公园散步。重视独处，不喜欢每天都要报备。',q:['你觉得亲近的人需要每天联系吗？','如果两个人习惯不同，你会怎么处理？'],a:[['我觉得每天分享生活很重要。','不一定，我也需要自己的空间。','我不太想讨论恋爱观。'],['我会试着沟通，找到平衡。','我希望对方和我习惯相近。','我还不确定。']],r:[['我可能不太一样，两三天不联系也可以。','我也是，不过有时别人会觉得我太冷淡。','没问题，不必现在讨论。'],['可以试试，不过我不希望谁一直迁就谁。','也合理，勉强改变习惯可能会很累。','这个确实不容易提前想清楚。']]},{name:'Nova',age:21,gender:'非二元性别',colors:['#B6A1EA','#F2C96B','#EA8B91'],tags:'美食 · 艺术 · 运动',quote:'我喜欢平凡生活中的小快乐。',bio:'喜欢打球、做饭，最近在学摄影。聊天比较随意，熟悉以后话会多一些。',q:['今天过得怎么样？','周末你一般喜欢做什么？'],a:[['挺忙的，刚结束一天的课。','还不错，做了点自己喜欢的事。','一般，不太想聊今天。'],['运动或者出去吃饭。','在家休息，看点东西。','没有固定安排。']],r:[['我也是，刚吃完饭。','挺好的，我今天去打球了。','没事，我们聊点别的。'],['我也经常这样，有时候会约朋友打球。','挺舒服的，我最近也在追一部剧。','哈哈，我也经常到了周末才决定。']]}];let p,history=[],round=0,revealed=false;const app=document.querySelector('#app');function show(html){app.innerHTML=html;app.focus();window.scrollTo(0,0)}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function avatar(p){return `<div class="avatar" aria-hidden="true" style="--a:${p.colors[0]};--b:${p.colors[1]};--c:${p.colors[2]}"><i></i><i></i><i></i></div>`}function welcome(){show('<h1>认识一个陌生人。</h1><p>这是一段约10分钟的模拟交友体验。你会先通过文字认识对方，再决定是否继续交流。</p><p class="note">所有人物、身份与对话均为虚构。没有正确答案，可以随时退出。</p>'+btn('开始体验','discover()','primary')+btn('暂不参与','end()','quiet'))}function discover(){show('<h1>发现</h1><p class="muted">选择一个你愿意了解的人，也可以不选。</p>'+people.map((v,i)=>`<div class="person">${avatar(v)}<div><strong>${v.name}</strong><div class="tag">${v.tags}</div><div>${v.quote}</div>${btn('认识 '+v.name,`profile(${i})`)}</div></div>`).join('')+btn('没有感兴趣的人','end()','quiet'))}function profile(i){p=people[i];history=[];round=0;revealed=false;show(`<div class="person">${avatar(p)}<div><h2>${p.name}</h2><div class="tag">${p.tags}</div></div></div><h2>${p.quote}</h2><p>${p.bio}</p>`+btn('开始聊天','chat()','primary')+btn('返回发现','discover()')+btn('结束体验','end()','quiet'))}function chat(){if(round>=2){choice();return}show(`<h2>与 ${p.name} 聊天</h2><small>模拟对话 · ${round+1}/2</small>`+history.map(v=>`<div class="bubble ${v.own?'own':''}">${v.text}</div>`).join('')+`<div class="bubble">${p.q[round]}</div><p class="muted">选择最接近你想法的回复。</p>`+p.a[round].map((v,i)=>btn(v,`answer(${i})`)).join('')+btn('结束交流','end()','quiet'))}function answer(i){history.push({text:p.q[round]},{text:p.a[round][i],own:true},{text:p.r[round][i]});round++;if(round<2)chat();else choice()}function choice(){show(`<h2>与 ${p.name} 的交流</h2>`+history.map(v=>`<div class="bubble ${v.own?'own':''}">${v.text}</div>`).join('')+'<h2>接下来，你想怎么做？</h2>'+btn('愿意继续认识对方','continueEnd()','primary')+(!revealed?btn('申请揭晓身份','consent()'):'')+btn('结束交流','end()','quiet'))}function consent(){show('<h1>身份揭晓</h1><p>只有双方都同意，才能揭晓身份。在本次模拟中，对方同意了你的申请。</p><p>你仍然可以改变主意。</p>'+btn('我也同意，查看身份','reveal()','primary')+btn('继续保持匿名','choice()')+btn('结束交流','end()','quiet'))}function reveal(){revealed=true;show(`<h1>认识 ${p.name}</h1><img class="portrait" src="${p.name.toLowerCase()}.svg" alt="虚构人物示意肖像"><small>虚构人物示意肖像</small><h2>${p.name} · ${p.age}岁</h2><p>性别：${p.gender}</p><p>${p.bio}</p>`+btn('愿意继续认识对方','continueEnd()','primary')+btn('结束交流','end()'))}function continueEnd(){show('<h1>交流暂告一段落</h1><p>你选择了继续认识对方。本次模拟体验到这里结束。</p>'+btn('结束体验','end()','primary'))}function end(){show('<h1>感谢参与。</h1><p>体验已结束。接下来可以和采访者聊聊刚才的感受。</p>'+btn('重新开始','welcome()'))}welcome();</script></body></html>
