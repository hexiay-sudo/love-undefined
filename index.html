const people=[{name:'Echo',age:22,gender:'女性',colors:['#F6A66B','#EA79A4','#9679CE'],tags:'音乐 · 阅读 · 影像',quote:'我喜欢收集适合雨天听的歌。',bio:'周末常去咖啡馆，偶尔一个人看电影。喜欢分享生活，但不太擅长主动开口。',q:['如果明天突然放假，你会怎么过？','你平时更喜欢一个人，还是有人陪？'],a:[['睡到自然醒，什么也不安排。','出去走走，找点新鲜的事情。','还没想好，换个话题吧。'],['喜欢有人一起分享生活。','我更享受自己的时间。','看情况，不一定。']],r:[['我也经常这样。最近忙起来，休息都像任务。','听起来不错，我有时也会临时买张电影票。','好呀，我们聊点别的。'],['我也喜欢分享，不过偶尔会不知道怎么开口。','我懂，我一个人看电影的时候也很自在。','确实，有时候想热闹，有时候只想安静。']]},{name:'Moss',age:23,gender:'男性',colors:['#62C4B0','#75B7E5','#EBC369'],tags:'电影 · 阅读 · 音乐',quote:'我喜欢思考没有简单答案的问题。',bio:'平时喜欢读书，也会去公园散步。重视独处，不喜欢每天都要报备。',q:['你觉得亲近的人需要每天联系吗？','如果两个人习惯不同，你会怎么处理？'],a:[['我觉得每天分享生活很重要。','不一定，我也需要自己的空间。','我不太想讨论恋爱观。'],['我会试着沟通，找到平衡。','我希望对方和我习惯相近。','我还不确定。']],r:[['我可能不太一样，两三天不联系也可以。','我也是，不过有时别人会觉得我太冷淡。','没问题，不必现在讨论。'],['可以试试，不过我不希望谁一直迁就谁。','也合理，勉强改变习惯可能会很累。','这个确实不容易提前想清楚。']]},{name:'Nova',age:21,gender:'非二元性别',colors:['#B6A1EA','#F2C96B','#EA8B91'],tags:'影像 · 音乐 · 阅读',quote:'我喜欢平凡生活中的小快乐。',bio:'喜欢打球、做饭，最近在学摄影。聊天比较随意，熟悉以后话会多一些。',q:['今天过得怎么样？','周末你一般喜欢做什么？'],a:[['挺忙的，刚结束一天的课。','还不错，做了点自己喜欢的事。','一般，不太想聊今天。'],['运动或者出去吃饭。','在家休息，看点东西。','没有固定安排。']],r:[['我也是，刚吃完饭。','挺好的，我今天去打球了。','没事，我们聊点别的。'],['我也经常这样，有时候会约朋友打球。','挺舒服的，我最近也在追一部剧。','哈哈，我也经常到了周末才决定。']]}];
const scripts = [[["我有个奇怪的习惯，喜欢把同一首歌听很多遍。你听歌更在意歌词还是旋律？", ["歌词，有时候像在替我说话。", "旋律，我不太关注歌词。", "都不是，我很少听歌。"], ["对，有些话自己说不出口，歌里却有。", "也挺好，我有些歌根本听不懂歌词。", "那你平时会被什么东西打动？"]], ["我很喜欢《爱在黎明破晓前》，两个人走了一夜也没做什么大事。你喜欢这种电影吗？", ["喜欢，细节比剧情更重要。", "我更喜欢有冲突的故事。", "这种片子太矫情了，喜欢的人也挺装的。"], ["是啊，最喜欢他们在唱片店那段。", "哈哈，我朋友也嫌它节奏慢。", "不喜欢电影没关系，但我不太喜欢把喜欢它的人也一起否定。"]], ["昨天想起我们聊电影的事。我有时会因为一段虚构故事难过很久。你会吗？", ["会，故事结束后还会想很久。", "不会，但我能理解。", "为虚构故事难过也太幼稚了。"], ["我还以为只有我会这样。", "嗯，不同的人感受不一样。", "我不太想自己的感受被这样评价。"]], ["我其实不太擅长把难过的事说出来。有时候只是希望有人听，不一定需要建议。", ["我会先听，等你想说再说。", "我习惯帮人想解决办法。", "这有什么好难过的，别想太多。"], ["那样我会比较自在。", "我知道是好意，只是有时我需要一点时间。", "这句话让我有点不舒服，我希望感受能被认真对待。"]], ["你觉得两个人一定要有共同爱好才能亲近吗？", ["不用，愿意了解彼此就好。", "共同爱好对我很重要。", "我更看重价值观。"], ["我也喜欢有人愿意听我讲不熟悉的东西。", "确实，有共同话题会自然很多。", "嗯，有些差异比爱好更难磨合。"]], ["有时我觉得沉默也可以是一种陪伴。你会觉得冷场尴尬吗？", ["不会，安静也挺舒服。", "会，我喜欢有来有回。", "看和谁在一起。"], ["对，不必一直找话题。", "那我们可能节奏不同，不过可以商量。", "确实，熟悉以后就不一样了。"]], ["这几天聊下来，你觉得我们是什么样的关系？", ["还想慢慢认识你。", "像可以聊心事的朋友。", "我觉得不太合适。"], ["可以啊，不急着定义。", "朋友也很好。", "明白，谢谢你直接告诉我。"]]], [["最近读到一个观点：自由不是想做什么就做什么，而是能拒绝不想做的事。你怎么看？", ["我认同，拒绝也是自由。", "我觉得自由更多是选择机会。", "我没太想过。"], ["是啊，尤其是拒绝别人期待的时候。", "这个角度也有意思，选择本身需要条件。", "没事，这也不是考试。"]], ["我喜欢一个人散步、读书，不太习惯随时在线。你对亲近的人有什么期待？", ["希望每天有些联系。", "彼此有空间就好。", "喜欢我就应该随时回消息。"], ["我可能做不到每天都聊，但可以商量。", "这样我会比较自在。", "我不接受随时待命的要求，希望你能尊重这一点。"]], ["我觉得亲密关系里也需要保留一些私人空间。你怎么看？", ["同意，信任不等于毫无保留。", "我更喜欢彼此透明。", "既然亲近，就应该让我查手机。"], ["对，我不想失去自己的生活。", "我理解，但我会保留一些隐私。", "查手机是我明确不接受的边界。"]], ["我有些观点可能和你不同。你觉得争论时最重要的是什么？", ["先理解对方的理由。", "把事情说清楚，哪怕争论。", "谁说不赢谁就闭嘴。"], ["我喜欢这种讨论方式。", "可以，只要不是攻击彼此。", "我不想在这种方式下交流。"]], ["如果喜欢的人选择了你不认同的生活方式，你会怎么办？", ["尊重，但看看是否适合相处。", "试着沟通，找共同点。", "我会要求对方改成我喜欢的样子。"], ["我觉得这很诚实。", "沟通有用，但也得接受无法改变的部分。", "我不愿意被要求成为另一个人。"]], ["你觉得被理解和被认同是一回事吗？", ["不是，可以理解但不同意。", "对我来说认同很重要。", "有时我也分不清。"], ["这句话我挺喜欢。", "那我们可能有点不同。", "我也是慢慢才分清的。"]], ["聊了几天，我觉得我们可以有分歧。你还想认识我吗？", ["想，分歧不一定是坏事。", "更适合当普通朋友。", "可能不太合适。"], ["那就慢慢来。", "可以，朋友也不必什么都一致。", "理解，不用勉强。"]]], [["我最近拍了一张很糊的照片，反而特别喜欢。你觉得作品一定要好看才有价值吗？", ["不用，有自己的意义就好。", "我还是比较在意完成度。", "我不太懂摄影。"], ["对！那张照
