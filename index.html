<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love, Undefined.</title><link rel="icon" href="logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#302c35;font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:620px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e0e8;padding-bottom:16px;margin-bottom:28px}header img{width:46px;border-radius:12px}header strong{font-size:19px}small,.muted{color:#706b75}h1{font-size:28px;line-height:1.3}h2{font-size:21px}button,a.button{font:inherit;cursor:pointer;border:1px solid #d8cde5;background:white;color:#49395e;border-radius:12px;padding:12px 16px;width:100%;display:block;margin:10px 0;text-align:center;text-decoration:none}button:hover{background:#eee8f6}button:focus-visible,a:focus-visible{outline:3px solid #a88bc9;outline-offset:3px}.primary{background:#67518b!important;color:white;border-color:#67518b}.quiet{border:0;background:transparent;color:#706b75}.person{display:flex;gap:16px;align-items:center;background:white;border:1px solid #e5e0e8;padding:16px;border-radius:18px;margin:14px 0}.person button{margin:8px 0 0}.avatar{width:86px;height:86px;flex:none;border-radius:18px;overflow:hidden;position:relative;background:#eee8f6}.avatar i{position:absolute;width:60%;height:60%;border-radius:50%;left:8%;top:12%;background:var(--a)}.avatar i:nth-child(2){left:38%;top:28%;background:var(--b);border-radius:25%}.avatar i:nth-child(3){left:17%;top:48%;background:var(--c)}.tag{font-size:13px;color:#67518b}.bubble{padding:13px 16px;background:#f8e8dc;border-radius:16px;margin:12px 35px 12px 0;white-space:pre-wrap}.own{background:#e9e3f6;margin:12px 0 12px 35px}.portrait{width:100%;max-width:300px;border-radius:18px;display:block;margin:18px auto}.note{padding:16px;background:#f0ebf5;border-radius:12px}footer{text-align:center;margin-top:30px;font-size:12px;color:#706b75}a{color:#67518b}#app:focus{outline:none}</style><style>.chathead{display:flex;align-items:center;gap:12px}.chathead .avatar{width:48px;height:48px}.timeline{text-align:center;color:#706b75;font-size:12px;margin:24px 0 10px}.bubble{width:fit-content;max-width:88%;overflow-wrap:anywhere}.own{margin-left:auto}.typing{color:#706b75;font-size:13px;padding:8px}.chatlog{max-height:48vh;overflow:auto;padding:4px 8px;scroll-behavior:smooth}.reply{border-top:1px solid #e5e0e8;padding-top:8px}button:disabled{opacity:.5;cursor:default}.meta{font-size:12px;color:#706b75}.bio{white-space:pre-line}.actions{display:flex;gap:8px}.actions button{font-size:14px}.person{align-items:flex-start}@media(max-width:480px){main{padding:16px}.person{gap:10px}.avatar{width:64px;height:64px}}</style></head><body><main><header><img src="logo.png" alt=""><div><strong>Love, Undefined.</strong><br><small>匿名交友体验 · 课程研究</small></div></header><section id="app" tabindex="-1" aria-live="polite"></section><footer>虚构体验 · 不收集个人信息</footer></main><script>
const people=[{name:'Echo',age:22,gender:'女性',colors:['#F6A66B','#EA79A4','#9679CE'],tags:'音乐 · 电影 · 旅行',quote:'我喜欢收集适合雨天听的歌。',bio:'周末常去咖啡馆，偶尔一个人看电影。喜欢分享生活，但不太擅长主动开口。',q:['如果明天突然放假，你会怎么过？','你平时更喜欢一个人，还是有人陪？'],a:[['睡到自然醒，什么也不安排。','出去走走，找点新鲜的事情。','还没想好，换个话题吧。'],['喜欢有人一起分享生活。','我更享受自己的时间。','看情况，不一定。']],r:[['我也经常这样。最近忙起来，休息都像任务。','听起来不错，我有时也会临时买张电影票。','好呀，我们聊点别的。'],['我也喜欢分享，不过偶尔会不知道怎么开口。','我懂，我一个人看电影的时候也很自在。','确实，有时候想热闹，有时候只想安静。']]},{name:'Moss',age:23,gender:'男性',colors:['#62C4B0','#75B7E5','#EBC369'],tags:'阅读 · 自然 · 思考',quote:'我喜欢思考没有简单答案的问题。',bio:'平时喜欢读书，也会去公园散步。重视独处，不喜欢每天都要报备。',q:['你觉得亲近的人需要每天联系吗？','如果两个人习惯不同，你会怎么处理？'],a:[['我觉得每天分享生活很重要。','不一定，我也需要自己的空间。','我不太想讨论恋爱观。'],['我会试着沟通，找到平衡。','我希望对方和我习惯相近。','我还不确定。']],r:[['我可能不太一样，两三天不联系也可以。','我也是，不过有时别人会觉得我太冷淡。','没问题，不必现在讨论。'],['可以试试，不过我不希望谁一直迁就谁。','也合理，勉强改变习惯可能会很累。','这个确实不容易提前想清楚。']]},{name:'Nova',age:21,gender:'非二元性别',colors:['#B6A1EA','#F2C96B','#EA8B91'],tags:'美食 · 艺术 · 运动',quote:'我喜欢平凡生活中的小快乐。',bio:'喜欢打球、做饭，最近在学摄影。聊天比较随意，熟悉以后话会多一些。',q:['今天过得怎么样？','周末你一般喜欢做什么？'],a:[['挺忙的，刚结束一天的课。','还不错，做了点自己喜欢的事。','一般，不太想聊今天。'],['运动或者出去吃饭。','在家休息，看点东西。','没有固定安排。']],r:[['我也是，刚吃完饭。','挺好的，我今天去打球了。','没事，我们聊点别的。'],['我也经常这样，有时候会约朋友打球。','挺舒服的，我最近也在追一部剧。','哈哈，我也经常到了周末才决定。']]}];
const scripts = [[["我有个奇怪的习惯，喜欢把同一首歌听很多遍。你听歌更在意歌词还是旋律？", ["歌词，有时候像在替我说话。", "旋律，我不太关注歌词。", "都不是，我很少听歌。"], ["对，有些话自己说不出口，歌里却有。", "也挺好，我有些歌根本听不懂歌词。", "那你平时会被什么东西打动？"]], ["我很喜欢《爱在黎明破晓前》，两个人走了一夜也没做什么大事。你喜欢这种电影吗？", ["喜欢，细节比剧情更重要。", "我更喜欢有冲突的故事。", "这种片子太矫情了，喜欢的人也挺装的。"], ["是啊，最喜欢他们在唱片店那段。", "哈哈，我朋友也嫌它节奏慢。", "不喜欢电影没关系，但我不太喜欢把喜欢它的人也一起否定。"]], ["昨天想起我们聊电影的事。我有时会因为一段虚构故事难过很久。你会吗？", ["会，故事结束后还会想很久。", "不会，但我能理解。", "为虚构故事难过也太幼稚了。"], ["我还以为只有我会这样。", "嗯，不同的人感受不一样。", "我不太想自己的感受被这样评价。"]], ["我其实不太擅长把难过的事说出来。有时候只是希望有人听，不一定需要建议。", ["我会先听，等你想说再说。", "我习惯帮人想解决办法。", "这有什么好难过的，别想太多。"], ["那样我会比较自在。", "我知道是好意，只是有时我需要一点时间。", "这句话让我有点不舒服，我希望感受能被认真对待。"]], ["你觉得两个人一定要有共同爱好才能亲近吗？", ["不用，愿意了解彼此就好。", "共同爱好对我很重要。", "我更看重价值观。"], ["我也喜欢有人愿意听我讲不熟悉的东西。", "确实，有共同话题会自然很多。", "嗯，有些差异比爱好更难磨合。"]], ["有时我觉得沉默也可以是一种陪伴。你会觉得冷场尴尬吗？", ["不会，安静也挺舒服。", "会，我喜欢有来有回。", "看和谁在一起。"], ["对，不必一直找话题。", "那我们可能节奏不同，不过可以商量。", "确实，熟悉以后就不一样了。"]], ["这几天聊下来，你觉得我们是什么样的关系？", ["还想慢慢认识你。", "像可以聊心事的朋友。", "我觉得不太合适。"], ["可以啊，不急着定义。", "朋友也很好。", "明白，谢谢你直接告诉我。"]]], [["最近读到一个观点：自由不是想做什么就做什么，而是能拒绝不想做的事。你怎么看？", ["我认同，拒绝也是自由。", "我觉得自由更多是选择机会。", "我没太想过。"], ["是啊，尤其是拒绝别人期待的时候。", "这个角度也有意思，选择本身需要条件。", "没事，这也不是考试。"]], ["我喜欢一个人散步、读书，不太习惯随时在线。你对亲近的人有什么期待？", ["希望每天有些联系。", "彼此有空间就好。", "喜欢我就应该随时回消息。"], ["我可能做不到每天都聊，但可以商量。", "这样我会比较自在。", "我不接受随时待命的要求，希望你能尊重这一点。"]], ["我觉得亲密关系里也需要保留一些私人空间。你怎么看？", ["同意，信任不等于毫无保留。", "我更喜欢彼此透明。", "既然亲近，就应该让我查手机。"], ["对，我不想失去自己的生活。", "我理解，但我会保留一些隐私。", "查手机是我明确不接受的边界。"]], ["我有些观点可能和你不同。你觉得争论时最重要的是什么？", ["先理解对方的理由。", "把事情说清楚，哪怕争论。", "谁说不赢谁就闭嘴。"], ["我喜欢这种讨论方式。", "可以，只要不是攻击彼此。", "我不想在这种方式下交流。"]], ["如果喜欢的人选择了你不认同的生活方式，你会怎么办？", ["尊重，但看看是否适合相处。", "试着沟通，找共同点。", "我会要求对方改成我喜欢的样子。"], ["我觉得这很诚实。", "沟通有用，但也得接受无法改变的部分。", "我不愿意被要求成为另一个人。"]], ["你觉得被理解和被认同是一回事吗？", ["不是，可以理解但不同意。", "对我来说认同很重要。", "有时我也分不清。"], ["这句话我挺喜欢。", "那我们可能有点不同。", "我也是慢慢才分清的。"]], ["聊了几天，我觉得我们可以有分歧。你还想认识我吗？", ["想，分歧不一定是坏事。", "更适合当普通朋友。", "可能不太合适。"], ["那就慢慢来。", "可以，朋友也不必什么都一致。", "理解，不用勉强。"]]], [["我最近拍了一张很糊的照片，反而特别喜欢。你觉得作品一定要好看才有价值吗？", ["不用，有自己的意义就好。", "我还是比较在意完成度。", "我不太懂摄影。"], ["对！那张照片让我想起当时的风。", "也合理，我也想把技术练好。", "没关系，你有没有喜欢做的事情？"]], ["我打球和摄影都不算厉害，但就是喜欢。你会为了纯粹的兴趣做一件事吗？", ["会，不一定要有成果。", "我喜欢看到自己进步。", "没成绩还坚持，挺浪费时间的。"], ["哈哈，终于有人懂。", "进步也挺快乐的。", "我不太喜欢用成绩衡量所有兴趣。"]], ["朋友说我做事太随性。我承认有时会忘事，但也不想什么都按计划来。", ["我喜欢这种自由感。", "我比较有计划，但可以协调。", "你这种人就是不靠谱。"], ["有时临时决定反而很好玩。", "那可能需要提前约好重要的事。", "可以说具体哪里不合适，但别直接给我贴标签。"]], ["我喜欢开玩笑，但如果别人说不舒服，我会停。你觉得幽默有边界吗？", ["有，彼此都觉得好笑才好。", "有时需要磨合。", "开不起玩笑的人太玻璃心了。"], ["对，笑话不该只让一个人开心。", "嗯，发现不舒服就调整。", "我不喜欢把别人的不舒服当成笑话。"]], ["我有时候不想把所有爱好变成赚钱的技能。你怎么看？", ["同意，喜欢本身就有意义。", "我希望兴趣也能带来收入。", "两种都可以。"], ["对，不然连休息都像工作。", "也不错，只要自己开心。", "哈哈，确实没必要二选一。"]], ["你觉得相处舒服更重要，还是有很多深刻的话题更重要？", ["舒服更重要。", "我希望能聊得深入。", "两者都想要。"], ["我也是，不用每句话都有意义。", "我愿意试试，但不一定每次都聊得很深。", "那就看当时的心情吧。"]], ["跟你聊天之后，我有点好奇以后还会不会有话聊。你呢？", ["愿意继续认识。", "当朋友就挺好。", "我想结束交流。"], ["好啊，慢慢来。", "朋友也很不错！", "好，祝你之后一切顺利。"]]]];
people[0].bio='最近常在咖啡馆待到关门，喜欢老电影和雨天。手机里有很多按心情分类的歌单。朋友说我熟悉以后话很多，但刚认识时有点慢热。';people[1].bio='平时工作结束后喜欢沿着公园走一圈。书读得很杂，偶尔写几句笔记。不太喜欢临时改变计划，也很珍惜独处时间。';people[2].bio='最近在学做饭和摄影，周末经常和朋友打球。喜欢随手记录生活里的小事，做事有点随性，偶尔忘东忘西。';
let strikes=0,misses=0, idleTimer, pendingDay=false, p,idx,round=0,history=[],epoch=0,busy=false,revealed=false;const app=document.querySelector('#app');const wait=ms=>new Promise(r=>setTimeout(r,ms));function show(html){clearTimeout(idleTimer);app.innerHTML=html;app.focus();window.scrollTo(0,0)}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function avatar(p){return `<div class="avatar" aria-hidden="true" style="--a:${p.colors[0]};--b:${p.colors[1]};--c:${p.colors[2]}"><i></i><i></i><i></i></div>`}function welcome(){epoch++;show('<h1>认识一个陌生人。</h1><p>这是一段约8–10分钟的模拟交友体验。故事中的交流跨越三天，时间会适当快进。对方也有自己的选择，可以拒绝揭晓或结束交流。阅读时不必着急；若长时间未回复，模拟情境可能继续发展。</p><p class="note">所有人物、身份与对话均为虚构。可以随时退出，不需要提供个人信息。</p>'+btn('开始体验','discover()','primary')+btn('暂不参与','end()','quiet'))}function discover(){epoch++;show('<h1>发现</h1><p class="muted">选择一个你愿意了解的人，也可以不选。</p>'+people.map((v,i)=>`<div class="person">${avatar(v)}<div><strong>${v.name}</strong><div class="tag">${v.tags}</div><div>${v.quote}</div><p class="meta">${v.bio}</p>${btn('认识 '+v.name,`profile(${i})`)}</div></div>`).join('')+btn('没有感兴趣的人','end()','quiet'))}function profile(i){epoch++;idx=i;p=people[i];clearTimeout(idleTimer);strikes=0;misses=0;pendingDay=false;history=[];round=0;revealed=false;busy=false;show(`<div class="person">${avatar(p)}<div><h2>${p.name}</h2><div class="tag">${p.tags}</div></div></div><h2>${p.quote}</h2><p>${p.bio}</p>`+btn('开始聊天','start()','primary')+btn('返回发现','discover()')+btn('结束体验','end()','quiet'))}function day(r){return r<2?'第一天 · 晚上':r<5?'第二天 · 傍晚':'第三天 · 晚上'}function log(){return history.map(v=>v.day?`<div class="timeline">${v.day}</div>`:`<div class="bubble ${v.own?'own':''}">${v.text}</div>`).join('')}function render(options='',status=''){show(`<div class="chathead">${avatar(p)}<div><strong>${p.name}</strong><div class="meta">${day(Math.min(round,6))} · 模拟交流</div></div></div><div class="chatlog" id="log">${log()}${status?`<div class="typing">${status}</div>`:''}</div><div class="reply">${options}</div><div class="actions">${!revealed&&!status?btn('申请揭晓身份','consent()','quiet'):''}${btn('结束交流','end()','quiet')}</div>`);const l=document.querySelector('#log');l.scrollTop=l.scrollHeight;if(busy){document.querySelectorAll('.actions button').forEach(b=>{if(b.textContent.includes('揭晓'))b.disabled=true})}}async function start(){const e=++epoch;busy=true;history.push({day:day(0)});render('','对方正在输入…');await wait(1800);if(e!==epoch)return;history.push({text:scripts[idx][0][0]});busy=false;prompt()}function prompt(){pendingDay=false;render(scripts[idx][round][1].map((v,i)=>btn(v,`answer(${i})`)).join('')+btn('暂时不回复（模拟时间过去）','skip()','quiet'));idleTimer=setTimeout(()=>{if(document.hidden){prompt();return}skip()},90000)}async function answer(i){if(busy)return;busy=true;const e=++epoch;const row=scripts[idx][round];history.push({text:row[1][i],own:true});render('','对方正在输入…');await wait(2400+Math.min(row[2][i].length*45,1800));if(e!==epoch)return;history.push({text:row[2][i]});const boundary=(idx===0&&[1,2,3].includes(round)||idx===1&&[1,2,3,4].includes(round)||idx===2&&[1,2,3].includes(round))&&i===2;if(boundary)strikes++;misses=0;render();await wait(1800);if(e!==epoch)return;if(strikes>=2){partnerEnd('boundary');return}if(boundary){busy=false;render(btn('抱歉，刚才表达得不太好。','repair()')+btn('我还是坚持刚才的说法。','insist()')+btn('先不回复','skip()','quiet'));document.querySelectorAll('.actions button').forEach(b=>{if(b.textContent.includes('揭晓'))b.disabled=true});return}if(round===6&&i===2&&idx!==1){end();return}advance()}function repair(){history.push({own:true,text:'抱歉，刚才表达得不太好。'},{text:'谢谢你愿意解释。我们可以继续聊。'});strikes=0;advance()}function insist(){history.push({own:true,text:'我还是坚持刚才的说法。'});partnerEnd('boundary')}function skip(){if(busy)return;history.push({day:'模拟时间过去 · 你没有回复'});misses++;if(misses>=2){partnerEnd('silence');return}history.push({text:['你可能在忙，没关系。等你方便再聊。','你可能有自己的事，先不打扰了。','哈哈，可能你在忙吧，晚点聊。'][idx]});advance()}function advance(){round++;busy=false;if(round>=7){choice();return}if(round===2||round===5){pendingDay=true;render(btn('时间快进 · '+day(round),'nextDay()','primary'));return}nextQuestion()}function nextDay(){pendingDay=false;history.push({day:day(round)});nextQuestion()}async function nextQuestion(){busy=true;const e=++epoch;render('','对方正在输入…');await wait(2200);if(e!==epoch)return;history.push({text:scripts[idx][round][0]});busy=false;prompt()}function partnerEnd(reason){epoch++;busy=false;const notes=["这两天聊得挺开心的。不过我想了想，暂时不想继续认识新的人了。谢谢你陪我聊天。","谢谢这几次交流。我觉得我们可能更适合各自的生活节奏，就先聊到这里吧。","跟你聊天挺轻松的，不过我最近想把时间留给自己的生活。先到这里啦。"];history.push({text:reason==='silence'?['好像我们没有太多交流的机会，那我先不打扰了。','我们可能交流节奏不太一样，我就先结束这次聊天了。','看起来你最近挺忙的，我先退出啦，祝你顺利。'][idx]:['我想了想，还是不太舒服。我们先聊到这里吧。','我已经说过我的边界了。我不想继续这样的交流。','我觉得我们相处的方式不太合适，就先到这里吧。'][idx]});history.push({day:p.name+" 已结束交流"});show(`<div class="chathead">${avatar(p)}<strong>${p.name}</strong></div><div class="chatlog" id="log">${log()}</div><p class="note">对方选择结束交流。本次聊天已关闭，无法继续发送消息或申请揭晓身份。</p>`+btn("结束体验","end()","primary"));const l=document.querySelector("#log");l.scrollTop=l.scrollHeight;}function choice(){render('<h2>接下来，你想怎么做？</h2>'+btn('愿意继续认识对方','continueEnd()','primary')+(!revealed?btn('申请揭晓身份','consent()'):'')+btn('结束交流','end()'))}function consent(){if(busy)return;epoch++;if(strikes>0||misses>0||round<2){show('<h1>暂不揭晓</h1><p>对方觉得现在还不适合交换身份，希望保留匿名。</p>'+btn('继续保持匿名','resume()','primary')+btn('结束交流','end()','quiet'));return}show('<h1>身份揭晓</h1><p>在本次虚构情境中，对方同意揭晓。你仍然可以改变主意。</p>'+btn('我也同意，查看身份','reveal()','primary')+btn('继续保持匿名','resume()')+btn('结束交流','end()','quiet'))}function resume(){if(round>=7)choice();else if(pendingDay){render(btn('时间快进 · '+day(round),'nextDay()','primary'))}else prompt()}function reveal(){revealed=true;show(`<h1>认识 ${p.name}</h1><img class="portrait" src="${p.name.toLowerCase()}.jpg" alt="AI生成的虚构成年人物照片"><small>AI生成的虚构成年人物照片</small><h2>${p.name} · ${p.age}岁</h2><p>性别：${p.gender}</p><p>${p.bio}</p>`+btn('继续聊天','resume()','primary')+btn('结束交流','end()'))}function continueEnd(){show('<h1>交流暂告一段落</h1><p>你选择了继续认识对方。本次模拟体验到这里结束。</p>'+btn('结束体验','end()','primary'))}function end(){epoch++;busy=false;show('<h1>感谢参与。</h1><p>体验已结束。接下来可以和采访者聊聊刚才的感受。</p>'+btn('重新开始','welcome()'))}welcome();</script></body></html>
